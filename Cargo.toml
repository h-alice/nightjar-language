[package]
name = "nightjar-lang"
version = "0.1.0"
edition = "2021"
description = "A declarative, prefix-notation DSL for formal verification of structured data."
license = "Apache-2.0"
authors = ["Wayne Hong (h-alice) <contact@halice.art>"]

[features]
default = ["json"]
json = ["dep:serde_json"]
yaml = ["dep:serde_yaml"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", optional = true }
serde_yaml = { version = "0.9", optional = true }
thiserror = "2"

[dev-dependencies]
proptest = "1"
